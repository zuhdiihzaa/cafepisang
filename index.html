
<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Nutrition Facts
Menu Cafe Pisang</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: #0b0b0b;
      color: white;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;

      background:
        radial-gradient(circle at top left, #1d4d2b 0%, transparent 30%),
        radial-gradient(circle at bottom right, #9b5c2d 0%, transparent 30%),
        linear-gradient(135deg, #111, #1a1a1a);

      z-index: -2;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      backdrop-filter: blur(60px);
      z-index: -1;
    }

    /* HERO */

    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
      text-align: center;
      position: relative;
    }

    /* LOGO */

    .logo-3d-wrapper {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 30px;
      perspective: 1800px;
    }

    .logo-glow {
      position: absolute;
      width: 420px;
      height: 420px;
      border-radius: 50%;

      background:
        radial-gradient(circle,
          rgba(255, 208, 0, .45) 0%,
          rgba(255, 132, 0, .25) 35%,
          transparent 70%);

      filter: blur(55px);

      animation: pulseGlow 4s ease-in-out infinite;
    }

    .logo-3d {
      width: 370px;

      transform-style: preserve-3d;

      animation:
        floating 6s ease-in-out infinite,
        rotate3d 12s ease-in-out infinite alternate;

      transition: .5s;
    }

    .logo-3d:hover {
      transform:
        rotateY(18deg)
        rotateX(8deg)
        scale(1.05);
    }

    .logo-3d img {
      width: 100%;
      object-fit: contain;

      filter:
        drop-shadow(0 30px 40px rgba(0, 0, 0, .5))
        drop-shadow(0 0 30px rgba(255, 255, 255, .15));
    }

    @keyframes floating {

      0% {
        transform:
          translateY(0px)
          rotateX(0deg);
      }

      50% {
        transform:
          translateY(-18px)
          rotateX(4deg);
      }

      100% {
        transform:
          translateY(0px)
          rotateX(0deg);
      }
    }

    @keyframes rotate3d {

      0% {
        transform:
          rotateY(-8deg)
          rotateX(4deg);
      }

      100% {
        transform:
          rotateY(8deg)
          rotateX(-4deg);
      }
    }

    @keyframes pulseGlow {

      0% {
        transform: scale(1);
        opacity: .7;
      }

      50% {
        transform: scale(1.12);
        opacity: 1;
      }

      100% {
        transform: scale(1);
        opacity: .7;
      }
    }

    /* TITLE */

    .hero h1 {
      font-size: 88px;
      font-weight: 800;
      line-height: 1;

      background:
        linear-gradient(90deg, #ffd86f, #fc6262, #ffd86f);

      background-size: 200%;

      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;

      animation: gradient 6s linear infinite;
    }

    @keyframes gradient {
      0% {
        background-position: 0%;
      }

      100% {
        background-position: 200%;
      }
    }

    .hero p {
      margin-top: 18px;
      color: #d0d0d0;
      font-size: 20px;
      max-width: 800px;
    }

    .scroll-btn {
      margin-top: 40px;

      padding: 18px 34px;

      border: none;
      border-radius: 999px;

      background:
        linear-gradient(135deg, #2ecc71, #27ae60);

      color: white;
      font-size: 16px;
      font-weight: 600;

      cursor: pointer;
      transition: .4s;
    }

    .scroll-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 10px 30px rgba(46, 204, 113, .4);
    }

    /* SEARCH */

    .search-wrapper {
      width: 95%;
      max-width: 700px;
      margin: 0 auto 50px;
    }

    .search-box {
      width: 100%;
      padding: 20px 25px;

      border: none;
      outline: none;

      border-radius: 999px;

      background: rgba(255, 255, 255, .08);

      backdrop-filter: blur(20px);

      color: white;
      font-size: 16px;
    }

    .search-box::placeholder {
      color: #c0c0c0;
    }

    /* GRID */

    .container {
      width: 95%;
      max-width: 1800px;
      margin: auto;
      padding-bottom: 80px;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 28px;
    }

    .card {
      background: rgba(255, 255, 255, .06);

      border: 1px solid rgba(255, 255, 255, .08);

      border-radius: 30px;

      overflow: hidden;

      backdrop-filter: blur(20px);

      transition: .5s;
    }

    .card:hover {
      transform: translateY(-12px) scale(1.02);

      box-shadow:
        0 25px 50px rgba(0, 0, 0, .45);
    }

    .card img {
      width: 100%;
      height: 240px;
      object-fit: cover;

      transition: transform .8s ease;
    }

    .card:hover img {
      transform: scale(1.08);
    }

    .card-content {
      padding: 24px;
    }

    .badge {
      display: inline-block;

      padding: 8px 16px;

      border-radius: 999px;

      background:
        linear-gradient(135deg, #2ecc71, #27ae60);

      font-size: 13px;
      font-weight: 600;

      margin-bottom: 14px;
    }

    .title {
      font-size: 30px;
      font-weight: 700;
      margin-bottom: 20px;
    }

    .nutrition {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .item {
      background: rgba(255, 255, 255, .05);

      padding: 14px;

      border-radius: 18px;

      transition: .3s;
    }

    .item:hover {
      background: rgba(255, 255, 255, .12);
      transform: translateY(-3px);
    }

    .item h4 {
      color: #c0c0c0;
      font-size: 13px;
      margin-bottom: 6px;
      font-weight: 500;
    }

    .item p {
      font-size: 20px;
      font-weight: 700;
    }

    .footer {
      text-align: center;
      color: #aaa;
      padding: 40px;
    }

    @media(max-width:768px) {

      .hero h1 {
        font-size: 48px;
      }

      .logo-3d {
        width: 260px;
      }

      .logo-glow {
        width: 280px;
        height: 280px;
      }

      .title {
        font-size: 24px;
      }
    }
  </style>
</head>

    /* SEARCH */

    document.getElementById("searchInput")
      .addEventListener("keyup", function () {

        const value = this.value.toLowerCase();

        const cards = document.querySelectorAll(".card");

        cards.forEach(card => {

          const text = card.innerText.toLowerCase();

          card.style.display =
            text.includes(value)

      });
document.querySelectorAll('.card').forEach(card=>{

  card.addEventListener('mousemove',(e)=>{

    const rect = card.getBoundingClientRect();

    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    const centerX = rect.width / 2;
    const centerY = rect.height / 2;

    const rotateX = ((y - centerY) / 18);
    const rotateY = ((centerX - x) / 18);

    card.style.transform =
      `
      rotateX(${rotateX}deg)
      rotateY(${rotateY}deg)
      scale(1.03)
      `;
  });

  card.addEventListener('mouseleave',()=>{

    card.style.transform =
      `
      rotateX(0deg)
      rotateY(0deg)
      scale(1)
      `;
  });

});
