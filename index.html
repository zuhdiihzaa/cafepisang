<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Informasi Nilai Gizi</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:'Poppins',sans-serif;
  background:#0b0b0b;
  color:white;
  overflow-x:hidden;
}

/* BACKGROUND */

body::before{
  content:'';
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at top left,#1d4d2b 0%,transparent 30%),
    radial-gradient(circle at bottom right,#9b5c2d 0%,transparent 30%),
    linear-gradient(135deg,#111,#1a1a1a);
  z-index:-2;
}

body::after{
  content:'';
  position:fixed;
  inset:0;
  backdrop-filter:blur(50px);
  z-index:-1;
}

/* HERO */

.hero{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:40px 20px;
  position:relative;
}

.hero h1{
  font-size:90px;
  font-weight:800;
  line-height:1;
  background:linear-gradient(90deg,#ffd86f,#fc6262,#ffd86f);
  background-size:200%;
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  animation:gradient 6s linear infinite;
}

@keyframes gradient{
  0%{background-position:0%;}
  100%{background-position:200%;}
}

.hero p{
  margin-top:20px;
  color:#d0d0d0;
  font-size:20px;
  max-width:800px;
}

.scroll-btn{
  margin-top:40px;
  padding:16px 30px;
  border:none;
  border-radius:999px;
  background:linear-gradient(135deg,#2ecc71,#27ae60);
  color:white;
  font-size:16px;
  font-weight:600;
  cursor:pointer;
  transition:.4s;
}

.scroll-btn:hover{
  transform:scale(1.08);
  box-shadow:0 10px 30px rgba(46,204,113,.4);
}

/* TOP STATS */

.stats{
  width:95%;
  max-width:1600px;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
  margin-bottom:50px;
}

.stat-card{
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.08);
  padding:25px;
  border-radius:24px;
  text-align:center;
  backdrop-filter:blur(15px);
}

.stat-card h3{
  font-size:15px;
  color:#c9c9c9;
  margin-bottom:10px;
}

.stat-card p{
  font-size:32px;
  font-weight:700;
}

/* SEARCH */

.search-wrapper{
  width:95%;
  max-width:700px;
  margin:0 auto 50px;
  position:sticky;
  top:20px;
  z-index:999;
}

.search-box{
  width:100%;
  padding:20px 25px;
  border-radius:999px;
  border:none;
  outline:none;
  background:rgba(255,255,255,.08);
  backdrop-filter:blur(20px);
  color:white;
  font-size:16px;
}

.search-box::placeholder{
  color:#c0c0c0;
}

/* MENU GRID */

.container{
  width:95%;
  max-width:1800px;
  margin:auto;
  padding-bottom:80px;
}

.menu-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(340px,1fr));
  gap:28px;
}

.card{
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.08);
  border-radius:30px;
  overflow:hidden;
  backdrop-filter:blur(20px);
  transition:.5s;
  position:relative;
}

.card:hover{
  transform:translateY(-12px) scale(1.02);
  box-shadow:0 25px 50px rgba(0,0,0,.45);
}

.card img{
  width:100%;
  height:250px;
  object-fit:cover;
  transition:.5s;
}

.card:hover img{
  transform:scale(1.08);
}

.card-content{
  padding:24px;
}

.badge{
  display:inline-block;
  padding:8px 16px;
  border-radius:999px;
  background:linear-gradient(135deg,#2ecc71,#27ae60);
  font-size:13px;
  font-weight:600;
  margin-bottom:14px;
}

.title{
  font-size:30px;
  font-weight:700;
  margin-bottom:20px;
}

.nutrition{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

.item{
  background:rgba(255,255,255,.05);
  border-radius:18px;
  padding:14px;
  transition:.3s;
}

.item:hover{
  background:rgba(255,255,255,.12);
  transform:translateY(-3px);
}

.item h4{
  color:#c0c0c0;
  font-size:13px;
  margin-bottom:6px;
  font-weight:500;
}

.item p{
  font-size:20px;
  font-weight:700;
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.7);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:9999;
}

.modal-content{
  width:90%;
  max-width:700px;
  background:#1a1a1a;
  border-radius:30px;
  overflow:hidden;
  animation:popup .4s ease;
}

@keyframes popup{
  from{
    transform:scale(.7);
    opacity:0;
  }
  to{
    transform:scale(1);
    opacity:1;
  }
}

.modal img{
  width:100%;
  height:350px;
  object-fit:cover;
}

.modal-body{
  padding:30px;
}

.close{
  position:absolute;
  top:20px;
  right:25px;
  font-size:40px;
  cursor:pointer;
}

/* FOOTER */

.footer{
  text-align:center;
  padding:40px;
  color:#aaa;
}

@media(max-width:768px){

  .hero h1{
    font-size:52px;
  }

  .title{
    font-size:24px;
  }

}

</style>
</head>

<body>

<section class="hero">

<h1>Nutrition Facts
Menu Cafe Pisang</h1>

<p>
Informasi Nilai Gizi Cafe Pisang

<button class="scroll-btn" onclick="document.getElementById('menu').scrollIntoView()">

</div>

<div class="menu-grid" id="menuGrid">

/* SEARCH */

const text = card.innerText.toLowerCase();

card.style.display = text.includes(value)

/* MODAL */

function openModal(index){

</script>
